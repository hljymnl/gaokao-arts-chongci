<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 艺考冲刺营 · 文科历史 · 长笛生专属</title>
<style>
:root{
  --bg:#f6f4ef;
  --card:#ffffff;
  --ink:#2c2a26;
  --muted:#8a857c;
  --line:#e8e3d8;
  --brand:#e8592c;      /* 主橙 */
  --brand2:#b03a1f;
  --hist:#6b5b3e;       /* 历史棕 */
  --music:#7b3fa0;      /* 艺考紫 */
  --good:#3a9d5d;
  --warn:#e0a800;
  --bad:#d64545;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(233,89,44,.14), transparent 60%),
    radial-gradient(900px 500px at 0% 10%, rgba(123,63,160,.12), transparent 55%);
}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 20px;background:linear-gradient(120deg,var(--brand),var(--brand2) 55%,var(--music));
  color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.brand{font-size:1.3rem;font-weight:800;letter-spacing:.5px;}
.brand .tag{
  font-size:.72rem;font-weight:600;background:rgba(255,255,255,.22);
  padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;
}
.countdowns{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;font-weight:700;}
.countdowns .cd{
  background:rgba(255,255,255,.16);padding:4px 12px;border-radius:12px;white-space:nowrap;
}
.countdowns .cd b{font-size:1.05rem;margin-right:4px;}

/* ===== 导航 ===== */
.tabbar{
  display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);
  overflow-x:auto;position:sticky;top:60px;z-index:40;
}
.tab{
  border:none;background:#f0ede5;color:var(--ink);font-size:.95rem;font-weight:700;
  padding:9px 16px;border-radius:12px;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
.tab:hover{background:#e7e1d4;}
.tab.active{background:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(232,89,44,.35);}

/* ===== 布局 ===== */
.container{max-width:960px;margin:0 auto;padding:18px 16px 40px;}
.view{display:none;animation:fade .25s;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.card h2{margin:0 0 6px;font-size:1.15rem;}
.card h3{margin:16px 0 8px;font-size:1rem;}
.card .sub{color:var(--muted);font-size:.85rem;margin:0 0 12px;}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:800;margin:22px 0 12px;
}
.section-title .bar{width:6px;height:22px;background:var(--brand);border-radius:3px;}

/* ===== 进度条 ===== */
.bar-wrap{background:#eee9de;border-radius:20px;height:14px;overflow:hidden;margin:8px 0;}
.bar-fill{
  height:100%;background:linear-gradient(90deg,var(--good),var(--brand));
  border-radius:20px;transition:width .4s;width:0;
}
.pct{font-weight:800;color:var(--brand);}

/* ===== 任务列表 ===== */
.task{
  display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;background:#fff;
}
.task input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--brand);cursor:pointer;}
.task .t-body{flex:1;}
.task .t-title{font-weight:700;}
.task .t-meta{color:var(--muted);font-size:.8rem;margin-top:2px;}
.task.done .t-title{text-decoration:line-through;color:var(--muted);}
.task .badge{
  font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:10px;color:#fff;margin-left:8px;
}
.badge.hist{background:var(--hist);}
.badge.music{background:var(--music);}
.badge.quest{background:var(--brand);}
.task .pill{flex-shrink:0;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:10px;align-self:center;}

/* ===== 按钮 ===== */
.btn{
  border:none;background:var(--brand);color:#fff;font-weight:700;font-size:.92rem;
  padding:10px 18px;border-radius:12px;cursor:pointer;transition:.15s;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn.ghost{background:#f0ede5;color:var(--ink);}
.btn.music{background:var(--music);}
.btn.hist{background:var(--hist);}
.btn.big{width:100%;padding:14px;font-size:1rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ===== 徽章/奖杯 ===== */
.trophy-row{display:flex;gap:8px;flex-wrap:wrap;}
.trophy{
  background:#fff7ec;border:1px solid #f0d9a8;border-radius:12px;padding:8px 12px;font-size:.8rem;font-weight:600;
}

/* ===== 计划 ===== */
.week-card{background:#fff;border-left:5px solid var(--hist);}
.week-card.music-week{border-left-color:var(--music);}
.week-head{display:flex;justify-content:space-between;align-items:center;}
.week-tag{font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:10px;color:#fff;}
.week-tag.hist{background:var(--hist);}
.week-tag.music{background:var(--music);}
.day-list{list-style:none;padding:0;margin:10px 0 0;}
.day-list li{
  padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem;
}
.day-list li b{color:var(--brand);}
.weekly-goal{background:#f2f8f2;border:1px solid #cde6cd;color:#2f5d3a;padding:10px 14px;border-radius:12px;margin-top:10px;font-size:.9rem;}

/* ===== 历史闯关 ===== */
.stage-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.stage-btn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;}
.stage-btn.active{border-color:var(--hist);background:#f4efe4;}
.mini-game{
  background:linear-gradient(160deg,#faf6ee,#f1ebe0);border:1px solid #e6dcc8;
  border-radius:var(--radius);padding:18px;
}
.items{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0;
}
.item-chip{
  background:#fff;border:2px solid var(--hist);border-radius:12px;padding:12px 16px;
  font-weight:800;cursor:pointer;user-select:none;transition:.12s;text-align:center;min-width:90px;
}
.item-chip.selected{background:var(--hist);color:#fff;transform:scale(1.05);}
.item-chip.correct{background:var(--good);border-color:var(--good);color:#fff;}
.item-chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.game-feedback{font-size:.95rem;font-weight:600;text-align:center;min-height:24px;margin-top:8px;}
.hint-box{
  background:#fffbe6;border:1px solid #f0e0a0;padding:10px 14px;border-radius:12px;font-size:.88rem;margin-top:10px;
}
.qa-box{margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;}
.qa-question{font-weight:700;margin-bottom:8px;}
.qa-opts{display:flex;flex-direction:column;gap:8px;}
.qa-opt{
  border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.92rem;
}
.qa-opt:hover{border-color:var(--brand);}
.qa-opt.correct{background:#eaf5ea;border-color:var(--good);}
.qa-opt.wrong{background:#fbeaea;border-color:var(--bad);}
.qa-explain{font-size:.85rem;color:var(--muted);margin-top:8px;}

/* ===== 艺考 ===== */
.instrument-img{
  display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:12px;
  border:1px solid var(--line);
}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0;}
.stat{
  background:#f7f3f6;border:1px solid #e4d7e4;border-radius:12px;padding:12px;text-align:center;
}
.stat b{display:block;font-size:1.5rem;color:var(--music);}
.stat span{font-size:.78rem;color:var(--muted);}
.time-group{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;}
.time-group label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);}
.time-group input{width:80px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin-top:4px;}

/* ===== 周测 ===== */
.result-box{
  text-align:center;padding:24px;background:linear-gradient(160deg,#fff,#f7f3ee);
  border-radius:var(--radius);border:1px solid var(--line);
}
.result-score{font-size:2.6rem;font-weight:900;color:var(--brand);}
.result-msg{font-size:1.05rem;margin:8px 0 14px;}
.rank-up{color:var(--good);font-weight:700;}

/* ===== 统计 ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.kpi b{display:block;font-size:1.8rem;color:var(--brand);}
.kpi span{font-size:.8rem;color:var(--muted);}
.streak{font-size:.9rem;margin-top:8px;}

/* ===== 弹窗/提示 ===== */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
}
.modal{
  background:#fff;border-radius:var(--radius);max-width:520px;width:100%;padding:22px;
  max-height:82vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:12px;font-weight:600;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.emoji-big{font-size:2.2rem;}

.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px;}
@media(max-width:640px){
  .tabbar{top:auto;position:static;}
  .topbar{position:static;}
}
</style>
</head>

function defaultState() {

function load() {
  try {

      if (s && typeof s === 'object') return s;
    }
  } catch (e) {}
  return defaultState();
}

}

/* ================= 工具函数 ================= */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateStr(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function todayStr() { return dateStr(new Date()); }
function daysUntil(target) {
  var diff = target - new Date();
  return Math.max(0, Math.floor(diff / 86400000));
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function $(id) { return document.getElementById(id); }
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.hidden = true; }, 2200);
}

/* ================= 任务 ================= */
function getTasks(date) {
  if (!state.tasks[date]) {
    state.tasks[date] = DEFAULT_TASKS.map(function (t) {
      return { title: t.title, meta: t.meta, badge: t.badge, done: false };
    });
    save();
  }
  return state.tasks[date];
}
function tasksDoneCount(date) {
  var list = state.tasks[date];
  if (!list) return 0;
  return list.filter(function (t) { return t.done; }).length;
}
function checkinDays() {
  var n = 0;
  for (var d in state.tasks) {
    if (state.tasks[d].some(function (t) { return t.done; })) n++;
  }
  return n;
}
function streakDays() {
  var n = 0, d = new Date();
  while (true) {
    var key = dateStr(d);
    var list = state.tasks[key];
    if (list && list.some(function (t) { return t.done; })) { n++; }
    else if (n > 0 || key !== todayStr()) break;
    else { d.setDate(d.getDate() - 1); continue; }
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function musicTotalFor(date) {
  var m = state.music[date];
  if (!m) return 0;
  return (m.warmup || 0) + (m.piece || 0) + (m.sight || 0);
}
function musicWeekTotal() {
  var n = 0, d = new Date();
  for (var i = 0; i < 7; i++) {
    n += musicTotalFor(dateStr(d));
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function musicStreak() {
  var n = 0, d = new Date();
  while (true) {
    var t = musicTotalFor(dateStr(d));
    if (t > 0) n++;
    else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function musicAllTotal() {
  var n = 0;
  for (var d in state.music) n += musicTotalFor(d);
  return n;
}
function getTargets() {
  if (!state.targets) state.targets = JSON.parse(JSON.stringify(DEFAULT_TARGETS));
  return state.targets;
}
function scoreTotal(subs) {
  var n = 0;
  SCORE_KEYS.forEach(function (k) { n += parseInt(subs[k.name], 10) || 0; });
  return n;
}

/* ================= 倒计时 ================= */
function cdHTML(target, label) {
  var diff = target - new Date();
  if (diff <= 0) {
    return '<span class="cd"><b>已到</b>' + label + '</span>';
  }
  var d = Math.floor(diff / 86400000);
  var h = Math.floor(diff % 86400000 / 3600000);
  var m = Math.floor(diff % 3600000 / 60000);
  var s = Math.floor(diff % 60000 / 1000);
  var txt = d > 0 ? d + '天' + h + '时' : (h > 0 ? h + '时' + m + '分' : m + '分' + s + '秒');
  return '<span class="cd"><b>' + txt + '</b>' + label + '</span>';
}

function renderStageDetail(st) {
  var p = stageProg(st.id);

  var allMatched = p.pairsDone >= st.pairs.length;

    html += '<div class="game-feedback">🎉 本关已通关！再玩一遍巩固记忆：</div>';
  }

      html += '<div class="qa-opt" data-q="' + qi + '" data-opt="' + oi + '">' +
              String.fromCharCode(65 + oi) + '. ' + esc(o) + '</div>';
    });
    html += '</div><div class="qa-explain" hidden></div></div>';
  });
  html += '</div></div>';

  return html;
}

function startMatch(stageId) {
  histView.stage = stageId;
  var st = STAGES.filter(function (s) { return s.id === stageId; })[0];
  var matched = new Set();
  var p = stageProg(stageId);
  // 已通关则清空重玩；否则保留已完成的对
  if (p.pairsDone >= st.pairs.length) {
    p.pairsDone = 0; p.totalPairs = st.pairs.length;
    saveStageProg(stageId, p);
  } else {
    // 无法恢复中途状态，重新开始
    p.pairsDone = 0; p.totalPairs = st.pairs.length;
    saveStageProg(stageId, p);
  }
  histView.match = { matched: matched, selected: [] };
  renderHistory();
  buildMatchChips(st);
}

function buildMatchChips(st) {
  var area = $('match-area');
  if (!area) return;
  var chips = [];
  st.pairs.forEach(function (pair, i) {
    chips.push({ pair: i, side: 0, text: pair[0] });
    chips.push({ pair: i, side: 1, text: pair[1] });
  });
  var order = shuffle(chips);
  var m = histView.match;
  var html = '<div class="items">';
  order.forEach(function (c) {
    var cls = 'item-chip' + (m && m.matched.has(String(c.pair)) ? ' correct' : '');
    html += '<div class="' + cls + '" data-pair="' + c.pair + '" data-side="' + c.side + '">' +
            esc(c.text) + '</div>';
  });
  html += '</div>';
  area.innerHTML = html;
}

function onMatchChipClick(el) {
  var st = STAGES.filter(function (s) { return s.id === histView.stage; })[0];
  if (!st || !histView.match) return;
  var m = histView.match;
  if (m.matched.has(el.dataset.pair)) return;
  if (el.classList.contains('selected') || el.classList.contains('correct')) return;

  el.classList.add('selected');
  m.selected.push(el);

  if (m.selected.length === 2) {
    var a = m.selected[0], b = m.selected[1];
    if (a.dataset.pair === b.dataset.pair) {
      a.classList.remove('selected'); b.classList.remove('selected');
      a.classList.add('correct'); b.classList.add('correct');
      m.matched.add(a.dataset.pair);
      m.selected = [];
      var p = stageProg(st.id);
      p.pairsDone = m.matched.size; p.totalPairs = st.pairs.length;
      saveStageProg(st.id, p);
      $('match-feedback').textContent = '✅ 配对成功！还剩 ' + (st.pairs.length - m.matched.size) + ' 对';
      var bar = document.querySelector('#view-history .card .bar-fill');
      if (bar) bar.style.width = Math.round((m.matched.size / st.pairs.length) * 100) + '%';
      if (m.matched.size === st.pairs.length) {
        $('match-feedback').textContent = '🎉 太棒了！时间轴配对全部完成！继续做选择题吧';
        toast('🎉 时间轴配对通关！');
      }
    } else {
      a.classList.add('wrong'); b.classList.add('wrong');
      $('match-feedback').textContent = '❌ 不对哦，再想想';
      var self = this;
      setTimeout(function () {
        a.classList.remove('selected', 'wrong');
        b.classList.remove('selected', 'wrong');
        m.selected = [];
      }, 600);
    }
  }
}

function onQAClick(el) {
  var st = STAGES.filter(function (s) { return s.id === histView.stage; })[0];
  if (!st) return;
  var qi = +el.dataset.q, oi = +el.dataset.opt;
  var q = st.qa[qi];
  var box = el.closest('.qa-box');
  if (box.dataset.locked === '1') return;

  box.dataset.locked = '1';
  var opts = box.querySelectorAll('.qa-opt');
  opts.forEach(function (o) { o.style.pointerEvents = 'none'; });
  var correct = oi === q.ans;
  if (correct) el.classList.add('correct');
  else { el.classList.add('wrong'); opts[q.ans].classList.add('correct'); }
  var exp = box.querySelector('.qa-explain');
  exp.textContent = (correct ? '✅ 回答正确！' : '❌ 正确答案：' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '。') + q.explain;
  exp.hidden = false;

  // 统计本关完成情况
  var all = document.querySelectorAll('#qa-area .qa-box');
  var answered = 0, correctN = 0;
  all.forEach(function (b) {
    if (b.dataset.locked === '1') {
      answered++;
      if (b.querySelector('.qa-opt.correct') && !b.querySelector('.qa-opt.wrong')) correctN++;
    }
  });
  var p = stageProg(st.id);
  p.qaCorrect = correctN; p.qaTotal = st.qa.length;
  if (answered === all.length) {
    p.qaDone = true;
    saveStageProg(st.id, p);
    var msg = correctN === st.qa.length ? '🏆 全对！历史稳了！' :
              correctN >= 3 ? '👍 不错，继续巩固！' : '💪 有进步空间，回看解析再战！';
    toast('选择题完成：' + correctN + '/' + st.qa.length + ' ' + msg);
  }
  saveStageProg(st.id, p);
}

function submitQuiz() {
  var boxes = document.querySelectorAll('#quiz-area .qa-box');
  var chosen = {}, score = 0;
  boxes.forEach(function (b, qi) {
    var sel = b.querySelector('.qa-opt.selected');
    if (sel) chosen[qi] = +sel.dataset.opt;
  });
  boxes.forEach(function (b, qi) {
    var q = QUIZ[qi];
    b.dataset.locked = '1';
    var opts = b.querySelectorAll('.qa-opt');
    opts.forEach(function (o) {
      o.style.pointerEvents = 'none';
      var oi = +o.dataset.opt;
      if (oi === q.ans) o.classList.add('correct');
      else if (chosen[qi] === oi) o.classList.add('wrong');
      if (chosen[qi] === q.ans) score++;
    });
    var exp = b.querySelector('.qa-explain');
    exp.textContent = '解析：' + q.explain;
    exp.hidden = false;
  });
  state.quiz.push({ date: todayStr(), score: score });
  save();
  var prev = state.quiz.length > 1 ? state.quiz[state.quiz.length - 2].score : -1;
  var msg = score === QUIZ.length ? '🏆 满分！太强了！' :
            score >= 6 ? '👍 不错，继续保持！' :
            score >= 4 ? '💪 及格线附近，重点看解析' : '📚 别灰心，错题就是提分点';
  var rankUp = prev >= 0 && score > prev ? ' <span class="rank-up">↑ 比上次进步！</span>' : '';

}

  });

  document.addEventListener('change', function (e) {
    var cb = e.target;
    if (cb.id === 'reset-tasks' || !cb.dataset || !('task' in cb.dataset)) return;
    var i = +cb.dataset.task;
    var tasks = getTasks(todayStr());
    if (tasks[i]) { tasks[i].done = cb.checked; save(); }
    renderHome();
  });

  /* 首页按钮 */
  document.addEventListener('click', function (e) {
    if (e.target.id === 'reset-tasks') {
      var tasks = getTasks(todayStr());
      tasks.forEach(function (t) { t.done = false; });
      save();
      renderHome();
      toast('今日任务已重置');
    }
  });

  /* 历史：选关 */
  document.getElementById('view-history').addEventListener('click', function (e) {
    var btn = e.target.closest('.stage-btn');
    if (btn) { startMatch(btn.dataset.stage); return; }
    if (e.target.id === 'restart-match') { startMatch(histView.stage); return; }
    var chip = e.target.closest('.item-chip');
    if (chip) { onMatchChipClick(chip); return; }
    var opt = e.target.closest('.qa-opt');
    if (opt) { onQAClick(opt); return; }
    if (e.target.id === 'add-mistake') {
      var point = ($('mk-point').value || '').trim();
      var reason = ($('mk-reason').value || '').trim();
      if (!point) { toast('请先填写知识点'); return; }
      state.mistakes.push({ id: Date.now(), date: todayStr(), point: point, reason: reason });
      save(); renderHistory(); toast('📕 错题已记入错题本');
      return;
    }
    var delBtn = e.target.closest('[data-del-mistake]');
    if (delBtn) {
      var mid = +delBtn.dataset.delMistake;
      state.mistakes = state.mistakes.filter(function (m) { return m.id !== mid; });
      save(); renderHistory(); toast('🗑 已删除');
      return;
    }
  });

  /* 模考：保存成绩 */
  document.getElementById('view-stats').addEventListener('click', function (e) {
    if (e.target.id !== 'save-score') return;

    SCORE_KEYS.forEach(function (k) { subs[k.name] = parseInt($('sc-' + k.key).value, 10) || 0; });
    var targets = getTargets();
    SCORE_KEYS.forEach(function (k) { targets[k.name] = parseInt($('tg-' + k.key).value, 10) || 0; });
    var date = $('sc-date').value || todayStr();
    state.scores.push({ date: date, subs: subs, total: scoreTotal(subs) });

    toast('✅ 模考成绩已保存');

  });

  document.getElementById('view-music').addEventListener('click', function (e) {
    if (e.target.id !== 'save-music') return;

    var piece = parseInt($('m-piece').value, 10) || 0;
    var sight = parseInt($('m-sight').value, 10) || 0;
    state.music[todayStr()] = { warmup: warmup, piece: piece, sight: sight };

  document.getElementById('view-quiz').addEventListener('click', function (e) {
    var opt = e.target.closest('.qa-opt');
    if (opt) {
      var box = opt.closest('.qa-box');
      if (box.dataset.locked === '1') return;

        o.classList.remove('selected');

        o.style.background = '';
      });
      opt.classList.add('selected');
      opt.style.borderColor = 'var(--brand)';
      opt.style.background = '#fff3ee';
      return;
    }
    if (e.target.id === 'submit-quiz') submitQuiz();
    if (e.target.id === 'redo-quiz') { renderQuiz(); toast('已重新开始'); }
  });

  /* 底部重置入口 */
  var footer = document.querySelector('.footer');
  if (footer) {
    var resetLink = document.createElement('a');
    resetLink.href = 'javascript:void(0)';
    resetLink.textContent = '重置全部数据';
    resetLink.style.cssText = 'color:var(--muted);text-decoration:underline;margin-left:12px;font-size:.75rem;';
    resetLink.onclick = function () { showResetModal(); };
    footer.appendChild(resetLink);
  }
});

})();
</script>
</body>
</html>
